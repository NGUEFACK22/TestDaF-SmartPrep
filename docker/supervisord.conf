[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F -O
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de file d'attente intégré : traite les jobs (génération IA des défis,
; notifications) sans dépendre d'un service cron séparé. Redémarre chaque heure
; pour borner la mémoire (compatible offre gratuite, aucun réglage dashboard).
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=2 --timeout=300 --max-time=3600 --no-interaction
directory=/var/www/html
user=www-data
autorestart=true
startretries=3
stopwaitsecs=310
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
