[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F -O
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de file d'attente intégré : traite les jobs (génération IA des défis,
; notifications) sans dépendre d'un service cron séparé. Boucle auto-réparante
; avec `queue:work --once` (fiable) plutôt qu'un démon long (instable ici).
[program:queue-worker]
command=/bin/sh -c "while true; do php /var/www/html/artisan queue:work --stop-when-empty --tries=2 --timeout=300 --memory=256 --no-interaction >> /var/www/html/storage/logs/worker.out 2>&1; sleep 3; done"
directory=/var/www/html
user=www-data
; HOME=/tmp : évite que libpq tente /root/.postgresql/postgresql.crt (illisible),
; ce qui faisait échouer la connexion du worker à Neon (SQLSTATE[08006]).
environment=HOME="/tmp"
autorestart=true
startretries=10
stopwaitsecs=310
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
