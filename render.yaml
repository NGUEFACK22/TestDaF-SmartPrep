# SYNPHONIE sur Render (offre gratuite) + Neon (Postgres gratuit) + R2 (stockage gratuit).
# Déploiement : Render → New → Blueprint → choisir ce dépôt. Renseigner les
# variables marquées sync: false (une seule fois). Voir docs/DEPLOYMENT_GRATUIT.md.
services:
  - type: web
    name: synphonie
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    preDeployCommand: "php artisan migrate --force"
    envVars:
      - key: APP_NAME
        value: SYNPHONIE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true # TEMPORAIRE (diagnostic) : passer à false après correction
      - key: APP_URL
        value: https://testdaf-smartprep.onrender.com
      - key: APP_KEY
        sync: false # générer en local : php artisan key:generate --show
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      # --- Base Neon (Postgres serverless, offre gratuite) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-broad-queen-b5lqx7x0.c-7.us-east-2.aws.neon.tech # endpoint DIRECT Neon (le pooler casse les transactions : SQLSTATE[25P02])
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # --- Files d'attente / cache / sessions (base, sans Redis) ---
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # --- Stockage privé 100 % Neon (driver "database", sans objet externe) ---
      - key: TESTDAF_MEDIA_DISK
        value: database
      # --- R2/S3 (optionnel, plus tard si volume) : passer TESTDAF_MEDIA_DISK à s3 ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false # ex. https://<account-id>.r2.cloudflarestorage.com
      # --- IA (fournisseur actif : Groq) ---
      - key: AI_ENABLED
        value: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # ex. gsk_... (à renseigner une seule fois)
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_AI_REQUESTS
        value: 100
      - key: AI_AUTO_EVALUATION
        value: true
      - key: AI_MANUAL_REVIEW
        value: true

  # File d'attente + planificateur (abandons, purges) : 1 job/min traite
  # UN job en attente puis le scheduler (largement suffisant en gratuit).
  - type: cron
    name: synphonie-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: "php artisan schedule:run && php artisan queue:work --once --tries=3 --timeout=280"
    # Le worker est un service SEPARE : il n'hérite PAS des variables du web.
    # Sans elles, il ne peut ni se connecter à Neon ni signer les sessions.
    # fromService tierce les valeurs (secrets compris) depuis le service web.
    envVars:
      - key: APP_NAME
        fromService: { type: web, name: synphonie, envVarKey: APP_NAME }
      - key: APP_ENV
        fromService: { type: web, name: synphonie, envVarKey: APP_ENV }
      - key: APP_KEY
        fromService: { type: web, name: synphonie, envVarKey: APP_KEY }
      - key: APP_URL
        fromService: { type: web, name: synphonie, envVarKey: APP_URL }
      - key: LOG_CHANNEL
        fromService: { type: web, name: synphonie, envVarKey: LOG_CHANNEL }
      - key: DB_CONNECTION
        fromService: { type: web, name: synphonie, envVarKey: DB_CONNECTION }
      - key: DB_HOST
        fromService: { type: web, name: synphonie, envVarKey: DB_HOST }
      - key: DB_PORT
        fromService: { type: web, name: synphonie, envVarKey: DB_PORT }
      - key: DB_DATABASE
        fromService: { type: web, name: synphonie, envVarKey: DB_DATABASE }
      - key: DB_USERNAME
        fromService: { type: web, name: synphonie, envVarKey: DB_USERNAME }
      - key: DB_PASSWORD
        fromService: { type: web, name: synphonie, envVarKey: DB_PASSWORD }
      - key: DB_SSLMODE
        fromService: { type: web, name: synphonie, envVarKey: DB_SSLMODE }
      - key: SESSION_DRIVER
        fromService: { type: web, name: synphonie, envVarKey: SESSION_DRIVER }
      - key: CACHE_STORE
        fromService: { type: web, name: synphonie, envVarKey: CACHE_STORE }
      - key: QUEUE_CONNECTION
        fromService: { type: web, name: synphonie, envVarKey: QUEUE_CONNECTION }
      - key: TESTDAF_MEDIA_DISK
        fromService: { type: web, name: synphonie, envVarKey: TESTDAF_MEDIA_DISK }
      - key: AI_ENABLED
        fromService: { type: web, name: synphonie, envVarKey: AI_ENABLED }
      - key: AI_PROVIDER
        fromService: { type: web, name: synphonie, envVarKey: AI_PROVIDER }
      - key: GROQ_API_KEY
        fromService: { type: web, name: synphonie, envVarKey: GROQ_API_KEY }
      - key: GROQ_MODEL
        fromService: { type: web, name: synphonie, envVarKey: GROQ_MODEL }
      - key: MAX_AI_REQUESTS
        fromService: { type: web, name: synphonie, envVarKey: MAX_AI_REQUESTS }
      - key: AI_AUTO_EVALUATION
        fromService: { type: web, name: synphonie, envVarKey: AI_AUTO_EVALUATION }
      - key: AI_MANUAL_REVIEW
        fromService: { type: web, name: synphonie, envVarKey: AI_MANUAL_REVIEW }
